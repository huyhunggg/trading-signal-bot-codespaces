services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${PORT:-8787}:${PORT:-8787}"
    volumes:
      - bot-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  bot-data:
